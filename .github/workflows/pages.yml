name: Publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "config/publications.json"
      - "config/site.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/publications/**"
      - "scripts/site/**"
      - "src/publications/**"
      - "src/site/**"
      - "tsconfig.site.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir artefato público
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obter fonte
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Atualizar derivados públicos
        run: npm run site:refresh

      - name: Construir e validar
        run: npm run site:build

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
